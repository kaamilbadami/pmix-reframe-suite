stages:
  - pilot-generate
  - pilot-trigger
  - pr-prepare
  - test
  - pmix-collect
  - pmix-reconcile
  - pmix-apply
  - pr-finalize

include:
  - project: ci/resources/templates
    ref: main
    file:
      - /runners.yml
  - local: ci/openpmix_pr_jobs.yml

variables:
  OLCF_SERVICE_ACCOUNT: "gen243_auser"
  FF_GIT_URLS_WITHOUT_TOKENS: "1"
  PMIX_AUTHORITATIVE_STATE_FILE: "/lustre/orion/gen243/world-shared/kbadami/openpmix-ci/pmix-master.env"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

generate-openpmix-pr-pipelines:
  stage: pilot-generate
  extends:
    - .frontier-shell-runner
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OPENPMIX_PR_AUTODISCOVERY == "1"'
    - when: never
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - |
      set +x
      set -euo pipefail
      [[ -n ${GITHUB_PR_READ_TOKEN:-} ]] || {
          printf '%s\n' 'error: GITHUB_PR_READ_TOKEN is required' >&2
          exit 2
      }
      /usr/bin/rm -rf --one-file-system -- .ci-openpmix-pr-discovery
      [[ ! -L .ci-openpmix-pr-discovery &&
         ! -e .ci-openpmix-pr-discovery ]] || exit 2
      /usr/bin/mkdir -m 700 -- .ci-openpmix-pr-discovery
      python3 ci/discover_eligible_openpmix_prs.py \
          --output .ci-openpmix-pr-discovery/eligible.jsonl
      python3 ci/generate_openpmix_pr_child_pipeline.py \
          .ci-openpmix-pr-discovery/eligible.jsonl \
          .ci-openpmix-pr-discovery/pipeline.yml
  artifacts:
    expire_in: 1 day
    paths:
      - .ci-openpmix-pr-discovery/eligible.jsonl
      - .ci-openpmix-pr-discovery/pipeline.yml

trigger-openpmix-pr-pipelines:
  stage: pilot-trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $OPENPMIX_PR_AUTODISCOVERY == "1"'
    - when: never
  trigger:
    include:
      - artifact: .ci-openpmix-pr-discovery/pipeline.yml
        job: generate-openpmix-pr-pipelines
    strategy: mirror

generate-pmix-child-pipeline-pilot:
  stage: pilot-generate
  extends:
    - .frontier-shell-runner

  rules:
    - if: '$PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_CHILD_PIPELINE_PILOT == "1"'
    - when: never

  cache:
    key: pmix-master-state-v2
    paths:
      - .ci-state/pmix-master.env
    policy: pull

  script:
    - |
      set -euo pipefail

      if [[ ! -f .ci-state/pmix-master.env ]]; then
          printf 'error: cached PMIx state was not restored: %s\n' \
              '.ci-state/pmix-master.env' >&2
          exit 1
      fi

      discovery_state=.ci-state/pmix-master.env
      official_state_checksum_before=$(sha256sum -- .ci-state/pmix-master.env)

      mkdir -p ci-generated

      if [[ -z ${PMIX_CHILD_PIPELINE_BASE_SHA:-} ]]; then
          printf '%s\n' 'Pilot discovery baseline: official cached state'
      else
          if [[ ! $PMIX_CHILD_PIPELINE_BASE_SHA =~ ^[0-9A-Fa-f]{40}$ ]]; then
              printf '%s\n' \
                  'error: PMIX_CHILD_PIPELINE_BASE_SHA must be exactly 40 hexadecimal characters' \
                  >&2
              exit 1
          fi
          printf 'PMIX_COMMIT=%s\n' "$PMIX_CHILD_PIPELINE_BASE_SHA" > \
              ci-generated/pmix-pilot-state.env
          discovery_state=ci-generated/pmix-pilot-state.env
          printf 'Pilot discovery baseline override: %s\n' \
              "$PMIX_CHILD_PIPELINE_BASE_SHA"
      fi

      for test_script in ci/test_*.sh; do
          echo "Running $test_script"
          bash "$test_script"
      done

      bash ci/discover_untested_pmix_commits.sh \
          "$discovery_state" \
          ci-generated/pmix-untested-commits.txt

      generator_args=(
          ci-generated/pmix-untested-commits.txt
          ci-generated/pmix-child-pipeline.yml
      )
      if [[ -n ${PMIX_CHILD_PIPELINE_FAIL_COMMIT:-} ]]; then
          generator_args+=(
              --fail-commit "$PMIX_CHILD_PIPELINE_FAIL_COMMIT"
          )
      fi
      python3 ci/generate_pmix_child_pipeline.py "${generator_args[@]}"

      official_state_checksum_after=$(sha256sum -- .ci-state/pmix-master.env)
      if [[ $official_state_checksum_before != "$official_state_checksum_after" ]]; then
          printf '%s\n' \
              'error: the manual pilot modified the official cached PMIx state' >&2
          exit 1
      fi

      printf '%s\n' 'Discovered OpenPMIx commits:'
      cat ci-generated/pmix-untested-commits.txt

      printf '%s\n' 'Generated child pipeline:'
      cat ci-generated/pmix-child-pipeline.yml

  artifacts:
    expire_in: 1 day
    paths:
      - ci-generated/pmix-untested-commits.txt
      - ci-generated/pmix-child-pipeline.yml

trigger-pmix-child-pipeline-pilot:
  stage: pilot-trigger
  variables:
    PRRTE_BRANCH: "v5.0"
    PRRTE_COMMIT: "22820a01e17547dbf1c4f9628eac327f193caa45"
  rules:
    - if: '$PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_CHILD_PIPELINE_PILOT == "1"'
    - when: never
  trigger:
    include:
      - artifact: ci-generated/pmix-child-pipeline.yml
        job: generate-pmix-child-pipeline-pilot
    strategy: mirror

collect-reconcile-pmix-child-pipeline-pilot:
  stage: test
  extends:
    - .frontier-shell-runner

  timeout: 15m

  rules:
    - if: '$PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_CHILD_PIPELINE_PILOT == "1"'
      when: always
    - when: never

  needs:
    - job: generate-pmix-child-pipeline-pilot
      artifacts: true
    - job: trigger-pmix-child-pipeline-pilot
      artifacts: false

  script:
    - bash ci/run_pmix_collection_reconciliation_pilot.sh ci-generated/pmix-untested-commits.txt ci-pilot-results

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-generated/pmix-untested-commits.txt
      - ci-generated/pmix-child-pipeline.yml
      - ci-pilot-results/baseline-pmix-master.env
      - ci-pilot-results/current-pmix-master.env
      - ci-pilot-results/collection/collection-report.json
      - ci-pilot-results/collection/*.env
      - ci-pilot-results/reconciliation/reconciliation.env
      - ci-pilot-results/reconciliation/proposed-pmix-master.env

generate-pmix-child-pipeline-scheduled:
  stage: pilot-generate
  extends:
    - .frontier-shell-runner

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

  script:
    - |
      set -euo pipefail

      state_file=${PMIX_AUTHORITATIVE_STATE_FILE:?PMIX_AUTHORITATIVE_STATE_FILE is required}
      output_dir=ci-scheduled
      baseline_state="$output_dir/baseline-pmix-master.env"

      mkdir -p -- "$output_dir"
      python3 ci/apply_reconciled_pmix_state.py snapshot \
          --state "$state_file" \
          --output "$baseline_state"

      bash ci/discover_untested_pmix_commits.sh \
          "$baseline_state" \
          "$output_dir/pmix-untested-commits.txt"
      python3 ci/generate_pmix_child_pipeline.py \
          "$output_dir/pmix-untested-commits.txt" \
          "$output_dir/pmix-child-pipeline.yml"

  artifacts:
    expire_in: 14 days
    paths:
      - ci-scheduled/baseline-pmix-master.env
      - ci-scheduled/pmix-untested-commits.txt
      - ci-scheduled/pmix-child-pipeline.yml

trigger-pmix-child-pipeline-scheduled:
  stage: pilot-trigger
  variables:
    PRRTE_BRANCH: "v5.0"
    PRRTE_COMMIT: "22820a01e17547dbf1c4f9628eac327f193caa45"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
  trigger:
    include:
      - artifact: ci-scheduled/pmix-child-pipeline.yml
        job: generate-pmix-child-pipeline-scheduled
    strategy: mirror

collect-pmix-child-results-scheduled:
  stage: pmix-collect
  extends:
    - .frontier-shell-runner

  timeout: 15m

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: never

  needs:
    - job: generate-pmix-child-pipeline-scheduled
      artifacts: true
    - job: trigger-pmix-child-pipeline-scheduled
      artifacts: false

  script:
    - |
      set -euo pipefail

      python3 ci/pmix_scheduled_status.py clean \
          --directory ci-scheduled

      collector_status=0
      python3 ci/collect_pmix_child_results.py \
          --commits ci-scheduled/pmix-untested-commits.txt \
          --parent-pipeline-id "$CI_PIPELINE_ID" \
          --output ci-scheduled/collection \
          --trigger-job-name trigger-pmix-child-pipeline-scheduled || \
          collector_status=$?

      python3 ci/pmix_scheduled_status.py publish \
          --directory ci-scheduled \
          --kind collector \
          --status "$collector_status" \
          --pipeline-id "$CI_PIPELINE_ID" \
          --suite-commit "$CI_COMMIT_SHA"

      case $collector_status in
          0|3)
              exit 0
              ;;
          4|5|6)
              exit "$collector_status"
              ;;
          *)
              printf 'error: collector returned unexpected status %s\n' \
                  "$collector_status" >&2
              exit 1
              ;;
      esac

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-scheduled/collector-status.env
      - ci-scheduled/collection/collection-report.json
      - ci-scheduled/collection/*.env

reconcile-pmix-child-results-scheduled:
  stage: pmix-reconcile
  extends:
    - .frontier-shell-runner

  timeout: 15m

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: never

  needs:
    - job: generate-pmix-child-pipeline-scheduled
      artifacts: true
    - job: collect-pmix-child-results-scheduled
      artifacts: true

  script:
    - |
      set -euo pipefail

      python3 ci/pmix_scheduled_status.py clean \
          --directory ci-scheduled \
          --kind reconciliation
      collector_status=$(python3 ci/pmix_scheduled_status.py verify \
          --directory ci-scheduled \
          --kind collector \
          --pipeline-id "$CI_PIPELINE_ID" \
          --suite-commit "$CI_COMMIT_SHA")
      case $collector_status in
          0|3)
              ;;
          *)
              printf 'error: hard collector status prevents reconciliation: %s\n' \
                  "$collector_status" >&2
              exit 1
              ;;
      esac

      state_file=${PMIX_AUTHORITATIVE_STATE_FILE:?PMIX_AUTHORITATIVE_STATE_FILE is required}
      current_state=ci-scheduled/current-pmix-master.env
      if [[ -L $current_state ]] ||
         [[ -e $current_state && ! -f $current_state ]]; then
          printf 'error: current-state snapshot is unsafe: %s\n' \
              "$current_state" >&2
          exit 1
      fi
      rm -f -- "$current_state"
      python3 ci/apply_reconciled_pmix_state.py snapshot \
          --state "$state_file" \
          --output "$current_state"

      reconciliation_status=0
      python3 ci/reconcile_pmix_results.py \
          --baseline-state ci-scheduled/baseline-pmix-master.env \
          --current-state "$current_state" \
          --commits ci-scheduled/pmix-untested-commits.txt \
          --results ci-scheduled/collection \
          --suite-commit "$CI_COMMIT_SHA" \
          --output ci-scheduled/reconciliation || reconciliation_status=$?

      python3 ci/pmix_scheduled_status.py publish \
          --directory ci-scheduled \
          --kind reconciliation \
          --status "$reconciliation_status" \
          --pipeline-id "$CI_PIPELINE_ID" \
          --suite-commit "$CI_COMMIT_SHA"

      case $reconciliation_status in
          0|3)
              exit "$reconciliation_status"
              ;;
          4|5)
              exit "$reconciliation_status"
              ;;
          *)
              printf 'error: reconciler returned unexpected status %s\n' \
                  "$reconciliation_status" >&2
              exit 1
              ;;
      esac

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-scheduled/current-pmix-master.env
      - ci-scheduled/reconciliation-status.env
      - ci-scheduled/reconciliation/reconciliation.env
      - ci-scheduled/reconciliation/proposed-pmix-master.env

apply-pmix-reconciled-state-scheduled:
  stage: pmix-apply
  extends:
    - .frontier-shell-runner

  timeout: 15m
  resource_group: pmix-python-suite-frontier

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: never

  needs:
    - job: generate-pmix-child-pipeline-scheduled
      artifacts: true
    - job: reconcile-pmix-child-results-scheduled
      artifacts: true

  script:
    - |
      set -euo pipefail

      reconciliation_status=$(python3 ci/pmix_scheduled_status.py verify \
          --directory ci-scheduled \
          --kind reconciliation \
          --pipeline-id "$CI_PIPELINE_ID" \
          --suite-commit "$CI_COMMIT_SHA")
      case $reconciliation_status in
          0|3)
              ;;
          *)
              printf 'error: reconciliation status prevents state application: %s\n' \
                  "$reconciliation_status" >&2
              exit 1
              ;;
      esac

      python3 ci/apply_reconciled_pmix_state.py apply \
          --baseline-state ci-scheduled/baseline-pmix-master.env \
          --authoritative-state "$PMIX_AUTHORITATIVE_STATE_FILE" \
          --commits ci-scheduled/pmix-untested-commits.txt \
          --report ci-scheduled/reconciliation/reconciliation.env \
          --proposal ci-scheduled/reconciliation/proposed-pmix-master.env \
          --suite-commit "$CI_COMMIT_SHA"

trigger-pmix-failed-result-pilot:
  stage: pilot-trigger
  rules:
    - if: '$PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_FAILED_RESULT_PILOT == "1"'
    - when: never
  trigger:
    include:
      - local: ci/pmix_failed_result_child.yml
    strategy: mirror

probe-pmix-child-artifacts:
  stage: test
  extends:
    - .frontier-shell-runner

  timeout: 10m

  rules:
    - if: '$PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_ARTIFACT_RETRIEVAL_PILOT == "1"'
      when: manual
    - when: never

  script:
    - python3 ci/probe_pmix_child_artifacts.py

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-probe-results/

concurrency-preflight-a:
  stage: test
  extends:
    - .frontier-shell-runner

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

  script:
    - |
      id
      hostname
      pwd
      realpath .
      echo "CI_PROJECT_DIR=$CI_PROJECT_DIR"
      realpath "$CI_PROJECT_DIR"
      echo "CI_JOB_ID=$CI_JOB_ID"
      echo "CI_CONCURRENT_ID=$CI_CONCURRENT_ID"
      echo "CI_CONCURRENT_PROJECT_ID=$CI_CONCURRENT_PROJECT_ID"

      marker="$CI_PROJECT_DIR/concurrency-preflight-$CI_JOB_ID.txt"
      printf '%s\n' "$CI_JOB_ID" > "$marker"
      echo "marker=$marker"
      cat "$marker"
      sleep 20
      test "$(cat "$marker")" = "$CI_JOB_ID"
      rm "$marker"

concurrency-preflight-b:
  stage: test
  extends:
    - .frontier-shell-runner

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

  script:
    - |
      id
      hostname
      pwd
      realpath .
      echo "CI_PROJECT_DIR=$CI_PROJECT_DIR"
      realpath "$CI_PROJECT_DIR"
      echo "CI_JOB_ID=$CI_JOB_ID"
      echo "CI_CONCURRENT_ID=$CI_CONCURRENT_ID"
      echo "CI_CONCURRENT_PROJECT_ID=$CI_CONCURRENT_PROJECT_ID"

      marker="$CI_PROJECT_DIR/concurrency-preflight-$CI_JOB_ID.txt"
      printf '%s\n' "$CI_JOB_ID" > "$marker"
      echo "marker=$marker"
      cat "$marker"
      sleep 20
      test "$(cat "$marker")" = "$CI_JOB_ID"
      rm "$marker"

validate-pmix-tests-pr-pilot:
  stage: test
  extends:
    - .frontier-shell-runner

  rules:
    - if: '$PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_TESTS_PR_PILOT == "1"'
    - when: never

  script:
    - |
      set -euo pipefail

      if [[ -z ${PMIX_TESTS_PR_NUMBER:-} ]]; then
          printf '%s\n' 'error: PMIX_TESTS_PR_NUMBER is required' >&2
          exit 2
      fi
      if [[ -z ${GITHUB_PR_READ_TOKEN:-} ]]; then
          printf '%s\n' 'error: GITHUB_PR_READ_TOKEN is required' >&2
          exit 2
      fi

      bash ci/run_pmix_tests_pr_metadata_pilot.sh \
          "$PMIX_TESTS_PR_NUMBER" ci-pr-pilot

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-pr-pilot/pr.json
      - ci-pr-pilot/trusted-pr.env

prepare-pmix-tests-pr-pilot:
  stage: pr-prepare
  extends:
    - .frontier-shell-runner

  timeout: 10m

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
    - when: never

  script:
    - |
      # Trusted metadata/status boundary.  Eligibility is limited to the fixed
      # same-repository allowlist; approved-author code is trusted for this MVP.
      set -euo pipefail

      /usr/bin/rm -rf --one-file-system -- ci-pr-preparation
      if [[ -L ci-pr-preparation || -e ci-pr-preparation ]]; then
          printf '%s\n' 'error: could not remove previous preparation output' >&2
          exit 2
      fi

      if [[ -z ${PMIX_TESTS_PR_NUMBER:-} ]]; then
          printf '%s\n' 'error: PMIX_TESTS_PR_NUMBER is required' >&2
          exit 2
      fi
      if [[ -z ${GITHUB_PR_READ_TOKEN:-} ]]; then
          printf '%s\n' 'error: GITHUB_PR_READ_TOKEN is required' >&2
          exit 2
      fi
      if [[ -z ${GITHUB_STATUS_TOKEN:-} ]]; then
          printf '%s\n' 'error: GITHUB_STATUS_TOKEN is required' >&2
          exit 2
      fi

      /bin/bash ci/prepare_trusted_pmix_tests_pr.sh "$PMIX_TESTS_PR_NUMBER"

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-pr-preparation/preparation.env

run-pmix-tests-pr-pilot:
  stage: test
  extends:
    - .frontier-shell-runner

  timeout: 1h

  resource_group: pmix-python-suite-frontier

  variables:
    GITHUB_PR_READ_TOKEN: ""
    GITHUB_STATUS_TOKEN: ""
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: always
    - when: never

  needs:
    - job: prepare-pmix-tests-pr-pilot
      artifacts: true

  script:
    - |
      # This shell still has runner variables and touches no PR content.  After
      # fixed-path stale-output removal, the helper crosses env -i; fixed
      # Frontier module initialization occurs only in that scrubbed environment.
      set +x
      set -euo pipefail
      /usr/bin/rm -rf --one-file-system -- ci-pr-execution
      if [[ -L ci-pr-execution || -e ci-pr-execution ]]; then
          printf '%s\n' 'error: could not remove previous execution output' >&2
          exit 2
      fi
      /bin/bash ci/run_pmix_tests_pr_isolated.sh

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-pr-execution/result.env
      # The following checkout files are operator diagnostics only.  The
      # finalizer trusts neither them nor the execution workspace.
      - ci-pr-execution/checkout.env
      - ci-pr-execution/checkout-commit.txt
      - ci-pr-execution/test-source.sha256
      - ci-pr-execution/reframe/run-report.json
      - ci-pr-execution/reframe/stage/frontier/batch/pmix_test/PMIxTestsPRHelloWorldTest/pmix-tests-pr-run-started.env
      - ci-pr-execution/reframe/stage/frontier/batch/pmix_test/PMIxTestsPRHelloWorldTest/pmix-tests-pr-run-completed.env
      - ci-pr-execution/reframe/stage/frontier/batch/pmix_test/PMIxTestsPRHelloWorldTest/rfm_job.out
      - ci-pr-execution/reframe/stage/frontier/batch/pmix_test/PMIxTestsPRHelloWorldTest/rfm_job.err
      - ci-pr-execution/reframe/output/frontier/batch/pmix_test/PMIxTestsPRHelloWorldTest/rfm_job.out
      - ci-pr-execution/reframe/output/frontier/batch/pmix_test/PMIxTestsPRHelloWorldTest/rfm_job.err

finalize-pmix-tests-pr-pilot:
  stage: pr-finalize
  extends:
    - .frontier-shell-runner

  timeout: 10m

  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
    GITHUB_PR_READ_TOKEN: ""

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: always
    - when: never

  needs:
    - job: prepare-pmix-tests-pr-pilot
      artifacts: true
    - job: run-pmix-tests-pr-pilot
      artifacts: true

  script:
    - |
      # GIT_STRATEGY=clone gives this job a fresh trusted suite checkout.  The
      # execution workspace contributes only a strictly parsed result record,
      # never scripts.  This does not protect against a malicious approved
      # author running as the same service account; that author is trusted by
      # the bounded MVP policy.
      set +x
      set -euo pipefail
      /bin/bash ci/finalize_pmix_tests_pr_status.sh \
          ci-pr-preparation/preparation.env \
          ci-pr-execution/result.env

pmix-python-suite:
  stage: test
  extends:
    - .frontier-shell-runner

  timeout: 1h

  resource_group: pmix-python-suite-frontier

  rules:
    - if: '$OPENPMIX_PR_INTERNAL == "1"'
      when: never
    - if: '$PMIX_TESTS_PR_EXECUTION_PILOT == "1"'
      when: never
    - if: '$PMIX_TESTS_PR_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_ARTIFACT_RETRIEVAL_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_FAILED_RESULT_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $PMIX_CHILD_PIPELINE_PILOT == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

  cache:
    key: pmix-master-state-v2
    paths:
      - .ci-state/pmix-master.env
    policy: pull

  script:
    - |
      set -euxo pipefail

      if ! bash ci/report_github_status.sh pending 'Frontier PMIx CI is running'; then
          printf 'warning: could not report pending status to GitHub\n' >&2
      fi

    - bash ci/test_should_run_pmix_suite.sh
    - bash ci/test_collect_ci_artifacts.sh
    - bash ci/test_report_github_status.sh
    - bash ci/test_run_exact_pmix_commit.sh
    - bash ci/test_discover_untested_pmix_commits.sh
    - bash ci/test_generate_pmix_child_pipeline.sh
    - bash ci/test_pmix_collection_reconciliation_pilot.sh
    - bash ci/test_pmix_failed_result_child.sh
    - bash ci/test_probe_pmix_child_artifacts.sh
    - bash ci/test_write_pmix_commit_result.sh
    - bash ci/test_apply_reconciled_pmix_state.sh
    - bash ci/test_pmix_scheduled_status.sh
    - bash ci/test_pmix_scheduled_pipeline.sh

    - |
      decision_file=".ci-state/pmix-decision.env"
      bash ci/should_run_pmix_suite.sh "$decision_file"
      source "$decision_file"

      if [[ "$PMIX_RUN_SUITE" == 0 ]]; then
          printf 'Skipping complete PMIx Python suite for OpenPMIx %s and suite %s: %s\n' \
              "$PMIX_COMMIT" "$CI_COMMIT_SHA" "$PMIX_RUN_REASON"
          exit 0
      fi

      export PMIX_COMMIT
      printf 'Running complete PMIx Python suite for OpenPMIx %s and suite %s: %s\n' \
          "$PMIX_COMMIT" "$CI_COMMIT_SHA" "$PMIX_RUN_REASON"

      module load miniforge3/23.11.0-0

      python3 -m venv .ci-venv
      source .ci-venv/bin/activate

      python -m pip install --upgrade pip
      python -m pip install "Cython==3.2.6" "reframe-hpc==4.10.0"

      export PMIX_PYTHON="${CI_PROJECT_DIR}/.ci-venv/bin/python"
      export RFM_BIN="${CI_PROJECT_DIR}/.ci-venv/bin/reframe"

      "${PMIX_PYTHON}" --version
      "${PMIX_PYTHON}" -c 'import Cython; print("Cython", Cython.__version__)'
      "${RFM_BIN}" --version

      bash ci/run_exact_pmix_commit.sh

  after_script:
    - |
      set +x
      set -uo pipefail

      case "${CI_JOB_STATUS:-}" in
          success)
              github_state=success
              if [[ -f .ci-state/pmix-decision.env ]] &&
                 grep -Fxq 'PMIX_RUN_SUITE=0' .ci-state/pmix-decision.env; then
                  description='Frontier check passed; full suite skipped'
              else
                  description='Frontier PMIx CI passed'
              fi
              ;;
          failed)
              github_state=failure
              description='Frontier PMIx CI failed'
              ;;
          canceled)
              github_state=error
              description='Frontier PMIx CI was canceled'
              ;;
          *)
              github_state=error
              description='Frontier PMIx CI ended with an unexpected status'
              ;;
      esac

      if ! bash ci/report_github_status.sh "$github_state" "$description"; then
          printf 'warning: could not report final status to GitHub\n' >&2
      fi

      if ! ci/collect_ci_artifacts.sh; then
          printf 'warning: could not collect CI artifacts\n' >&2
      fi

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/
