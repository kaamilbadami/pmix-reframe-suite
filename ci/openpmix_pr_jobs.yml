# Reusable three-job internal OpenPMIx PR workflow. It is reachable only from
# an explicitly selected web pipeline or an isolated generated child pipeline.
.openpmix-baseline-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $OPENPMIX_PR_BASELINE == "1"'
      when: always
    - when: never

prepare-openpmix-baseline:
  extends: prepare-openpmix-pr
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $OPENPMIX_PR_BASELINE == "1"'
    - when: never
  variables:
    GITHUB_PR_READ_TOKEN: ""
    GITHUB_STATUS_TOKEN: ""
  script:
    - |
      set +x
      set -euo pipefail
      /usr/bin/rm -rf --one-file-system -- ci-openpmix-pr-preparation
      [[ ! -e ci-openpmix-pr-preparation && ! -L ci-openpmix-pr-preparation ]]
      /usr/bin/mkdir -m 700 -- ci-openpmix-pr-preparation
      python3 ci/openpmix_pr_baseline.py prepare --pipeline-id "$CI_PIPELINE_ID"
      /usr/bin/mkdir -m 700 -- .ci-baseline-staging-home .ci-baseline-staging-tmp
      /usr/bin/env -i PATH=/lustre/orion/gen243/proj-shared/pmix-reframe-ci-tools/pmix-py310/bin:/usr/bin:/bin LANG=C.UTF-8 \
          HOME="$CI_PROJECT_DIR/.ci-baseline-staging-home" \
          TMPDIR="$CI_PROJECT_DIR/.ci-baseline-staging-tmp" \
          CI_PIPELINE_ID="$CI_PIPELINE_ID" \
          GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
          PMIX_PYTHON=/lustre/orion/gen243/proj-shared/pmix-reframe-ci-tools/pmix-py310/bin/python \
          /lustre/orion/gen243/proj-shared/pmix-reframe-ci-tools/pmix-py310/bin/python \
          ci/openpmix_baseline_staging.py prepare
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-openpmix-pr-preparation/preparation.env
      - ci-openpmix-pr-preparation/baseline.env
      - ci-openpmix-pr-preparation/baseline-sources.tar.gz

validate-openpmix-baseline:
  extends: .openpmix-baseline-rules
  stage: test
  tags: [frontier, slurm]
  id_tokens:
    OLCF_ID_TOKEN:
      aud: https://code.olcf.ornl.gov
  timeout: 4h
  resource_group: pmix-python-suite-frontier
  variables:
    RUNNER_SCRIPT_TIMEOUT: "3h45m"
    RUNNER_AFTER_SCRIPT_TIMEOUT: "5m"
    GITHUB_PR_READ_TOKEN: ""
    GITHUB_STATUS_TOKEN: ""
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
    JACAMAR_SCHEDULER_ACTION: default
    SCHEDULER_PARAMETERS: "--account=gen243 --partition=batch --nodes=4 --ntasks=256 --ntasks-per-node=64 --exclusive --core-spec=0 --threads-per-core=1 --time=00:45:00"
  needs:
    - job: prepare-openpmix-baseline
      artifacts: true
  after_script:
    - /lustre/orion/gen243/proj-shared/pmix-reframe-ci-tools/pmix-py310/bin/python ci/openpmix_baseline_staging.py accounting
  script:
    - |
      set +x
      set -euo pipefail
      [[ ${SLURM_JOB_ID:-} =~ ^[1-9][0-9]*$ ]] || { printf '%s\n' 'error: Slurm runner allocation is required' >&2; exit 2; }
      /bin/bash ci/run_openpmix_pr_isolated.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-openpmix-pr-execution/result.env
      - ci-openpmix-pr-execution/evidence/
      - ci-openpmix-pr-execution/reframe/run-report.json
      - ci-openpmix-pr-execution/reframe/output/
      - ci-openpmix-pr-execution/reframe/perflogs/
      - ci-openpmix-pr-execution/reframe/stage/single-allocation-*/
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_job.sh
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_build.sh
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_job.out
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_job.err
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_build.out
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_build.err
      - ci-openpmix-pr-execution/reframe/stage/**/PMIX_COMMIT
      - ci-openpmix-pr-execution/reframe/stage/**/pmix-commit.env
      - ci-openpmix-pr-execution/reframe/stage/**/prrte-source.env

finalize-openpmix-baseline:
  extends:
    - finalize-openpmix-pr
    - .openpmix-baseline-rules
  needs:
    - job: prepare-openpmix-baseline
      artifacts: true
    - job: validate-openpmix-baseline
      artifacts: true

.openpmix-pr-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $OPENPMIX_PR_INTERNAL == "1"'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $OPENPMIX_PR_INTERNAL == "1"'
    - when: never

.openpmix-pr-always-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $OPENPMIX_PR_INTERNAL == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $OPENPMIX_PR_INTERNAL == "1"'
      when: always
    - when: never

prepare-openpmix-pr:
  stage: pr-prepare
  extends:
    - .frontier-shell-runner
    - .openpmix-pr-rules
  timeout: 10m
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - |
      set +x
      set -euo pipefail
      [[ ${OPENPMIX_PR_NUMBER:-} =~ ^[1-9][0-9]*$ ]] || {
          printf '%s\n' 'error: OPENPMIX_PR_NUMBER must be canonical' >&2
          exit 2
      }
      [[ -n ${GITHUB_PR_READ_TOKEN:-} ]] || {
          printf '%s\n' 'error: GITHUB_PR_READ_TOKEN is required' >&2
          exit 2
      }
      if [[ -n ${OPENPMIX_PR_EXPECTED_SHA:-} ]]; then
          /bin/bash ci/prepare_trusted_openpmix_pr.sh \
              "$OPENPMIX_PR_NUMBER" "$OPENPMIX_PR_EXPECTED_SHA"
      else
          /bin/bash ci/prepare_trusted_openpmix_pr.sh \
              "$OPENPMIX_PR_NUMBER"
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-openpmix-pr-preparation/preparation.env

run-openpmix-pr:
  stage: test
  extends:
    - .frontier-shell-runner
    - .openpmix-pr-always-rules
  timeout: 2h
  resource_group: pmix-python-suite-frontier
  variables:
    RUNNER_SCRIPT_TIMEOUT: "1h45m"
    RUNNER_AFTER_SCRIPT_TIMEOUT: "5m"
    GITHUB_PR_READ_TOKEN: ""
    GITHUB_STATUS_TOKEN: ""
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
  needs:
    - job: prepare-openpmix-pr
      artifacts: true
  script:
    - |
      set +x
      set -euo pipefail
      /bin/bash ci/run_openpmix_pr_isolated.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-openpmix-pr-execution/result.env
      - ci-openpmix-pr-execution/evidence/
      - ci-openpmix-pr-execution/reframe/run-report.json
      - ci-openpmix-pr-execution/reframe/output/
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_job.sh
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_build.sh
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_job.out
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_job.err
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_build.out
      - ci-openpmix-pr-execution/reframe/stage/**/rfm_build.err
      - ci-openpmix-pr-execution/reframe/stage/**/PMIX_COMMIT
      - ci-openpmix-pr-execution/reframe/stage/**/pmix-commit.env
      - ci-openpmix-pr-execution/reframe/stage/**/prrte-source.env

finalize-openpmix-pr:
  stage: pr-finalize
  extends:
    - .frontier-shell-runner
    - .openpmix-pr-always-rules
  timeout: 10m
  variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: none
    GIT_LFS_SKIP_SMUDGE: "1"
    GITHUB_PR_READ_TOKEN: ""
    GITHUB_STATUS_TOKEN: ""
  needs:
    - job: prepare-openpmix-pr
      artifacts: true
    - job: run-openpmix-pr
      artifacts: true
  script:
    - |
      set +x
      set -euo pipefail
      /bin/bash ci/finalize_openpmix_pr_result.sh \
          ci-openpmix-pr-preparation/preparation.env \
          ci-openpmix-pr-execution/result.env
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-openpmix-pr-final/final-result.env
