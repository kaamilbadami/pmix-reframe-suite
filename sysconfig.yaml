systems:
- name: frontier
  descr: Frontier system.
  hostnames: ['frontier\d+']
  modules_system: lmod
  partitions:
  - name: batch
    descr: Use nodes from the Slurm partition containing MI250X nodes
    scheduler: slurm
    launcher: local
    # If you care about GPU binding or cores per task, you must set it here, it is not handled by tests
    # Tests only handle -N/-n/--ntasks-per-node
    access: ['-A gen243 -p batch']
    # Rebuild Frontier's system-owned OLCF and Cray PE/Lmod state before
    # ReFrame emits any environment module commands. This is required by
    # trusted jobs that deliberately use `sbatch --export=NIL`.
    prepare_cmds:
    - 'printf "PMIX_PHASE %s site-init-start\n" "$(date -u +%FT%TZ)" | tee -a runtime-phases.log'
    - 'for pmix_diag_key in BASH_ENV CONDA_PREFIX CONDA_SHLVL LOADEDMODULES LD_LIBRARY_PATH TMPDIR SLURM_JOB_ID SLURM_JOB_NODELIST; do printf "%s=%s\n" "$pmix_diag_key" "${!pmix_diag_key-}"; done > runtime-site-environment.log'
    - '. /etc/profile.d/olcf-env.sh && . /etc/bash.bashrc.local'
    - 'printf "PMIX_PHASE %s site-init-finished\n" "$(date -u +%FT%TZ)" | tee -a runtime-phases.log'
    environs: ['pmix_test']

environments:
- name: pmix_test
